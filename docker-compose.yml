version: '3.8'

services:
  maintenances-db:
    container_name: maintenances-db
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgress:/var/lib/postgresql/data
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maintenances
